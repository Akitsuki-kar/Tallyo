[package]
name = "tallyo"
version = "0.1.2"
description = "Tallyo (水电动账) - 离线优先的水电读数记账原生壳"
authors = ["Akitsuki_Kar"]
edition = "2021"
rust-version = "1.77.2"

# Tauri 2 库/二进制产物：desktop 用 cdylib/rlib，mobile 用 staticlib。
[lib]
name = "tallyo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 仅引入内核与「按需插件」，保持最精简：
# - dialog：PDF 导出走系统保存框
# - fs：配合 dialog 把 PDF 字节写入用户选定路径
# - http：WebDAV 同步走原生 HTTP 通道（reqwest），绕过 WebView 的浏览器 CORS/CSP
#         —— 这是桌面/移动壳直连坚果云等跨域 WebDAV 的唯一正路（Web 端仍需同源反代）
# - opener：外链（鸣谢等）调起系统默认浏览器（Android → ACTION_VIEW，桌面 → 默认浏览器），
#   避免原生壳 WebView 内导航「回不到 App」；配合 src/native/openExternal.ts
# - keyring：见下方桌面专属依赖表（移动端无后端，不引入）
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# keyring 仅桌面：底层 keyring crate 只提供 Keychain(苹果)/Credential Manager(Windows)/
# SecretService(Linux dbus) 三个后端，无 Android/iOS 后端；若在安卓目标引入会连带
# dbus/zbus C 依赖导致 NDK 交叉编译失败。移动端 JS 层 secureKey.ts 自动回退 localStorage。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-keyring = "0.1"

[profile.release]
# 体积优先：裁剪符号、开启链接期优化（LTO）与单代码生成单元，配合原生 WebView 实现最精简产物。
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
